<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-tutoriales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <pattern id="grid-tutoriales" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="1" opacity="0.4"/>
    </pattern>

    <filter id="glow-gold-tutoriales" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-grad-tutoriales)"/>
  <rect width="1200" height="750" fill="url(#grid-tutoriales)"/>

  <!-- TOP HEADER -->
  <rect x="30" y="30" width="1140" height="65" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="60" y="70" fill="#FECF06" font-family="Ubuntu, sans-serif" font-weight="700" font-size="20">CENTRO DE TUTORIALES &amp; MANUALES FORENSES</text>
  <text x="530" y="70" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="15">|</text>
  <text x="550" y="70" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-weight="500" font-size="15">Guías de Extracción, ELA &amp; Análisis con Herramientas Oficiales</text>

  <rect x="980" y="48" width="160" height="30" rx="15" fill="rgba(254, 207, 6, 0.15)" stroke="#FECF06" stroke-width="1"/>
  <text x="1000" y="68" fill="#FECF06" font-family="Fira Code, monospace" font-size="12" font-weight="600">4 MANUALES OK</text>

  <!-- FORENSIC TOOLS CARDS ROW (4 TOOLS) -->
  <!-- Tool 1: IPED Forensics -->
  <rect x="30" y="115" width="265" height="110" rx="8" fill="#161B22" stroke="#FECF06" stroke-width="1.5"/>
  <text x="50" y="145" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">IPED Forensics v4.1</text>
  <text x="50" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Extracción Masiva WhatsApp</text>
  <text x="50" y="195" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">Gaceta INTERPOL / DPF</text>

  <!-- Tool 2: PhotoHolmes ELA Engine -->
  <rect x="320" y="115" width="265" height="110" rx="8" fill="#161B22" stroke="#9DFF00" stroke-width="1.5"/>
  <text x="340" y="145" fill="#9DFF00" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">PhotoHolmes ELA</text>
  <text x="340" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Análisis de Fotomontajes</text>
  <text x="340" y="195" fill="#9DFF00" font-family="Fira Code, monospace" font-size="11">Python Image Engine</text>

  <!-- Tool 3: PyOgg Audio Engine -->
  <rect x="610" y="115" width="265" height="110" rx="8" fill="#161B22" stroke="#00FF41" stroke-width="1.5"/>
  <text x="630" y="145" fill="#00FF41" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">PyOgg Audio Engine</text>
  <text x="630" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Decodificación Opus WhatsApp</text>
  <text x="630" y="195" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">Formato Vorbis / Opus</text>

  <!-- Tool 4: FTK Imager v4.7 -->
  <rect x="900" y="115" width="270" height="110" rx="8" fill="#161B22" stroke="#FECF06" stroke-width="1.5"/>
  <text x="920" y="145" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">FTK Imager v4.7</text>
  <text x="920" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Adquisición Bit a Bit Disco</text>
  <text x="920" y="195" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">AccessData Standard</text>

  <!-- MAIN TUTORIAL STEPS & TERMINAL WORKFLOW -->
  <!-- Left Column: MUI Accordion Tutorial Steps -->
  <rect x="30" y="245" width="555" height="475" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="55" y="280" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">PASOS DE EJECUCIÓN DEL PROTOCOLO DE EXTRACCIÓN</text>

  <!-- Accordion 1 (Expanded): Paso 1 Extracción IPED -->
  <rect x="55" y="300" width="505" height="150" rx="8" fill="#0D1117" stroke="#FECF06" stroke-width="1.5"/>
  <text x="75" y="328" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">▼ 1. Conexión ADB y Ejecución IPED Forensics v4.1</text>
  <text x="75" y="353" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="12">Establezca el puente ADB en modo solo lectura. Execute el binario IPED con el perfil de búsqueda de WhatsApp:</text>
  <rect x="75" y="365" width="465" height="40" rx="4" fill="#161B22"/>
  <text x="85" y="390" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">iped.exe -d /dev/block/bootdevice -o C:\forensic_output --profile whatsapp</text>

  <text x="75" y="430" fill="#8B949E" font-family="Fira Code, monospace" font-size="11">Salida esperada: msgstore.db extraído con Hash SHA-256 verificado.</text>

  <!-- Accordion 2: Paso 2 ELA PhotoHolmes -->
  <rect x="55" y="465" width="505" height="50" rx="8" fill="#0D1117" stroke="#21262D"/>
  <text x="75" y="495" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="600">▶ 2. Análisis de Matriz ELA con PhotoHolmes Python Engine</text>

  <!-- Accordion 3: Paso 3 Audios Opus -->
  <rect x="55" y="530" width="505" height="50" rx="8" fill="#0D1117" stroke="#21262D"/>
  <text x="75" y="560" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="600">▶ 3. Decodificación y Verificación Espectral de Audios Opus</text>

  <!-- Accordion 4: Paso 4 PRCC & Cierre -->
  <rect x="55" y="595" width="505" height="50" rx="8" fill="#0D1117" stroke="#21262D"/>
  <text x="75" y="625" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="600">▶ 4. Generación de Planilla PRCC y Sellado en Hash Chain</text>

  <!-- Right Column: Interactive Terminal Screen Mockup -->
  <rect x="615" y="245" width="555" height="475" rx="10" fill="#0D1117" stroke="#00FF41" stroke-width="1.5" filter="url(#glow-gold-tutoriales)"/>
  
  <!-- Terminal Window Bar -->
  <rect x="615" y="245" width="555" height="35" rx="10" fill="#161B22"/>
  <circle cx="635" cy="262" r="5" fill="#FF5F56"/>
  <circle cx="650" cy="262" r="5" fill="#FFBD2E"/>
  <circle cx="665" cy="262" r="5" fill="#27C93F"/>
  <text x="892" y="267" fill="#8B949E" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">terminal@sha256-forensic-engine</text>

  <!-- Terminal Output Code Lines -->
  <text x="635" y="305" fill="#00FF41" font-family="Fira Code, monospace" font-size="12">$ python3 -m photoholmes --image capture_001.jpg --ela --threshold 0.95</text>
  <text x="635" y="330" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11">[INFO] Initializing PhotoHolmes ELA Engine v2.4...</text>
  <text x="635" y="350" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11">[INFO] Processing JPEG quantization tables and JFIF headers...</text>
  <text x="635" y="370" fill="#9DFF00" font-family="Fira Code, monospace" font-size="11">[OK] ELA Variance: 0.0042 (Uniform Compression Residual - NO EDIT DETECTED)</text>
  
  <text x="635" y="410" fill="#00FF41" font-family="Fira Code, monospace" font-size="12">$ pyogg_tool --input PTT-20260801-WA0014.opus --export-wav --verify-hash</text>
  <text x="635" y="435" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11">[INFO] Decoding OGG/Opus audio stream (48000 Hz, Mono)...</text>
  <text x="635" y="455" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">[HASH] SHA-256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
  <text x="635" y="475" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">[SUCCESS] Audio Integrity Verified &amp; Stamped to SHA256.US Audit Ledger</text>

  <text x="635" y="520" fill="#00FF41" font-family="Fira Code, monospace" font-size="12">$ sha256_cms_cli commit --case CAS-2026-0891 --perito CIV-284102</text>
  <text x="635" y="545" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="11">[BLOCKCHAIN] Creating Block #104 in IndexedDB &amp; Neon DB...</text>
  <text x="635" y="565" fill="#9DFF00" font-family="Fira Code, monospace" font-size="11">[COMMITTED] Block Hash: 9f8a3c21b049e776a1001e45ff32a90b...</text>

  <!-- Terminal Cursor Blink -->
  <text x="635" y="610" fill="#00FF41" font-family="Fira Code, monospace" font-size="12">$ _</text>
  <rect x="650" y="598" width="8" height="15" fill="#00FF41"/>

</svg>
