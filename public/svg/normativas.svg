<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-normativas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <pattern id="grid-normativas" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="1" opacity="0.4"/>
    </pattern>

    <filter id="glow-lime-normativas" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-grad-normativas)"/>
  <rect width="1200" height="750" fill="url(#grid-normativas)"/>

  <!-- TOP HEADER -->
  <rect x="30" y="30" width="1140" height="65" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="60" y="70" fill="#9DFF00" font-family="Ubuntu, sans-serif" font-weight="700" font-size="20">MARCO NORMATIVO RAG VECTORIAL (77 DOCUMENTOS)</text>
  <text x="590" y="70" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="15">|</text>
  <text x="610" y="70" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-weight="500" font-size="15">Base de Conocimiento Jurídico-Forense Pre-cargada</text>

  <rect x="980" y="48" width="160" height="30" rx="15" fill="rgba(157, 255, 0, 0.15)" stroke="#9DFF00" stroke-width="1"/>
  <text x="1000" y="68" fill="#9DFF00" font-family="Fira Code, monospace" font-size="12" font-weight="600">MOTOR VEC 1536d</text>

  <!-- SEARCH BAR WITH VECTOR AI INDICATOR -->
  <rect x="30" y="115" width="1140" height="70" rx="10" fill="#161B22" stroke="#9DFF00" stroke-width="1.5" filter="url(#glow-lime-normativas)"/>
  <text x="60" y="156" fill="#9DFF00" font-family="Fira Code, monospace" font-size="18">🔍</text>
  <text x="95" y="156" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16">"cadena de custodia para extracciones de conversaciones whatsapp en formato opus"</text>
  
  <rect x="920" y="130" width="230" height="40" rx="6" fill="#9DFF00"/>
  <text x="940" y="155" fill="#0D1117" font-family="Ubuntu, sans-serif" font-weight="800" font-size="13">BUSCAR VECTORIALMENTE</text>

  <!-- MAIN 2 COLUMNS LAYOUT -->
  <!-- Left Column: Matched Normative Cards Stack -->
  <rect x="30" y="205" width="650" height="515" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="55" y="240" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">NORMATIVAS Y ARTÍCULOS RELEVANTES (TOP COINCIDENCIAS)</text>

  <!-- Card 1: MUCC-2017 -->
  <rect x="55" y="260" width="600" height="130" rx="8" fill="#0D1117" stroke="#9DFF00" stroke-width="1.5"/>
  <rect x="55" y="260" width="6" height="130" rx="3" fill="#9DFF00"/>
  <text x="75" y="290" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">MUCC-2017 (Manual Único de Cadena de Custodia)</text>
  <rect x="500" y="273" width="140" height="24" rx="12" fill="rgba(157, 255, 0, 0.15)"/>
  <text x="515" y="289" fill="#9DFF00" font-family="Fira Code, monospace" font-size="11" font-weight="700">SIMILITUD 98.4%</text>

  <text x="75" y="315" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="13">Capítulo III Art. 14: Procedimiento para aseguramiento de evidencias digitales en teléfonos móviles.</text>
  <text x="75" y="340" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">Keywords: whatsapp, opus, embalaje faraday, hash sha-256</text>
  <text x="75" y="365" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">Categoría: Norma Nacional Obligatoria (Gaceta Oficial #41.294)</text>

  <!-- Card 2: ISO/IEC 27037:2012 -->
  <rect x="55" y="405" width="600" height="130" rx="8" fill="#0D1117" stroke="#30363D"/>
  <rect x="55" y="405" width="6" height="130" rx="3" fill="#FECF06"/>
  <text x="75" y="435" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">ISO/IEC 27037:2012</text>
  <rect x="500" y="418" width="140" height="24" rx="12" fill="rgba(254, 207, 6, 0.15)"/>
  <text x="515" y="434" fill="#FECF06" font-family="Fira Code, monospace" font-size="11" font-weight="700">SIMILITUD 94.1%</text>

  <text x="75" y="460" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="13">Directrices para la identificación, recolección, adquisición y preservación de evidencia digital.</text>
  <text x="75" y="485" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">Keywords: DEFR, digital evidence, acquisition, chain of custody</text>
  <text x="75" y="510" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">Categoría: Estándar Internacional ISO</text>

  <!-- Card 3: COPP Art. 223 -->
  <rect x="55" y="550" width="600" height="130" rx="8" fill="#0D1117" stroke="#30363D"/>
  <rect x="55" y="550" width="6" height="130" rx="3" fill="#00FF41"/>
  <text x="75" y="580" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">Código Orgánico Procesal Penal (COPP) - Art. 223</text>
  <rect x="500" y="563" width="140" height="24" rx="12" fill="rgba(0, 255, 65, 0.15)"/>
  <text x="515" y="579" fill="#00FF41" font-family="Fira Code, monospace" font-size="11" font-weight="700">SIMILITUD 91.8%</text>

  <text x="75" y="605" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="13">Requisitos legales para la práctica de peritajes científicos y designación de 2 o más expertos.</text>
  <text x="75" y="630" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">Keywords: perito, juramento, dictamen colegiado, validez probatoria</text>

  <!-- Right Column: RAG Neural Network Visual & Detailed Viewer -->
  <rect x="700" y="205" width="470" height="515" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="725" y="240" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">ESTRUCTURA DE EMBEDDINGS VECTORIALES</text>

  <!-- Vector Network Neural Graphic -->
  <rect x="725" y="260" width="420" height="180" rx="8" fill="#0D1117" stroke="#21262D"/>
  
  <!-- Neural Nodes -->
  <circle cx="780" cy="350" r="12" fill="#9DFF00" filter="url(#glow-lime-normativas)"/>
  <circle cx="860" cy="300" r="10" fill="#FECF06"/>
  <circle cx="860" cy="400" r="10" fill="#00FF41"/>
  <circle cx="960" cy="320" r="14" fill="#9DFF00" filter="url(#glow-lime-normativas)"/>
  <circle cx="960" cy="380" r="8" fill="#FECF06"/>
  <circle cx="1060" cy="350" r="16" fill="#00FF41"/>

  <!-- Neural Connections -->
  <line x1="780" y1="350" x2="860" y2="300" stroke="#9DFF00" stroke-width="2"/>
  <line x1="780" y1="350" x2="860" y2="400" stroke="#9DFF00" stroke-width="2"/>
  <line x1="860" y1="300" x2="960" y2="320" stroke="#FECF06" stroke-width="1.5"/>
  <line x1="860" y1="400" x2="960" y2="380" stroke="#00FF41" stroke-width="1.5"/>
  <line x1="960" y1="320" x2="1060" y2="350" stroke="#9DFF00" stroke-width="2.5"/>
  <line x1="960" y1="380" x2="1060" y2="350" stroke="#00FF41" stroke-width="1.5"/>

  <!-- RAG Response Output Container -->
  <rect x="725" y="455" width="420" height="240" rx="8" fill="#0D1117" stroke="#9DFF00" stroke-width="1"/>
  <text x="745" y="485" fill="#9DFF00" font-family="Fira Code, monospace" font-size="12" font-weight="700">SÍNTESIS JURÍDICA GENERADA (RAG AI):</text>

  <text x="745" y="515" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="12">Para la extracción de chats de WhatsApp, la normativa MUCC-2017 exige la generación de un hash SHA-256 inmutable inmediatamente tras la extracción con herramientas certificadas (IPED/FTK).</text>
  
  <text x="745" y="575" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="12">El Dictamen Pericial debe ser suscrito conforme al Art. 223 del COPP, adjuntando la Planilla PRCC de cadena de custodia continua.</text>

  <rect x="745" y="635" width="380" height="40" rx="6" fill="rgba(254, 207, 6, 0.15)" stroke="#FECF06" stroke-width="1"/>
  <text x="765" y="660" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">CITAR EN DICTAMEN PERICIAL (COPIAR CITA)</text>

</svg>
