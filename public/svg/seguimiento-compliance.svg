<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-stepper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <pattern id="grid-stepper" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="1" opacity="0.4"/>
    </pattern>

    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-grad-stepper)"/>
  <rect width="1200" height="750" fill="url(#grid-stepper)"/>

  <!-- TOP TITLE BAR -->
  <rect x="30" y="30" width="1140" height="65" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="60" y="70" fill="#FECF06" font-family="Ubuntu, sans-serif" font-weight="700" font-size="20">SEGUIMIENTO DE COMPLIANCE FORENSE</text>
  <text x="440" y="70" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="15">|</text>
  <text x="460" y="70" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-weight="500" font-size="15">Flujo Forense WhatsApp (9 Pasos Bloqueados Secuencialmente)</text>

  <rect x="980" y="48" width="160" height="30" rx="15" fill="rgba(157, 255, 0, 0.15)" stroke="#9DFF00" stroke-width="1"/>
  <text x="1005" y="68" fill="#9DFF00" font-family="Fira Code, monospace" font-size="12" font-weight="600">PASO 4 EN CURSO</text>

  <!-- STEPPER TIMELINE HEADER (1 to 9) -->
  <rect x="30" y="115" width="1140" height="110" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>

  <!-- Connector Line Behind Circles -->
  <line x1="80" y1="160" x2="1120" y2="160" stroke="#30363D" stroke-width="4"/>
  <line x1="80" y1="160" x2="520" y2="160" stroke="#00FF41" stroke-width="4"/>

  <!-- Step 1 (Completed) -->
  <circle cx="80" cy="160" r="18" fill="#00FF41"/>
  <path d="M 73 160 L 78 165 L 88 155" fill="none" stroke="#0D1117" stroke-width="3"/>
  <text x="50" y="200" fill="#00FF41" font-family="Ubuntu, sans-serif" font-size="11" font-weight="600">1. Recepción</text>

  <!-- Step 2 (Completed) -->
  <circle cx="210" cy="160" r="18" fill="#00FF41"/>
  <path d="M 203 160 L 208 165 L 218 155" fill="none" stroke="#0D1117" stroke-width="3"/>
  <text x="175" y="200" fill="#00FF41" font-family="Ubuntu, sans-serif" font-size="11" font-weight="600">2. Inspección</text>

  <!-- Step 3 (Completed) -->
  <circle cx="340" cy="160" r="18" fill="#00FF41"/>
  <path d="M 333 160 L 338 165 L 348 155" fill="none" stroke="#0D1117" stroke-width="3"/>
  <text x="300" y="200" fill="#00FF41" font-family="Ubuntu, sans-serif" font-size="11" font-weight="600">3. Adquisición</text>

  <!-- Step 4 (ACTIVE NOW) -->
  <circle cx="470" cy="160" r="22" fill="#FECF06" stroke="#9DFF00" stroke-width="3" filter="url(#glow-lime)"/>
  <text x="464" y="166" fill="#0D1117" font-family="Ubuntu, sans-serif" font-size="16" font-weight="800">4</text>
  <text x="425" y="202" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="12" font-weight="700">4. Análisis ELA</text>

  <!-- Step 5 (Locked) -->
  <circle cx="600" cy="160" r="18" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <text x="595" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="565" y="200" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">5. Transcripción</text>

  <!-- Step 6 (Locked) -->
  <circle cx="730" cy="160" r="18" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <text x="725" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">6</text>
  <text x="700" y="200" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">6. Dictamen</text>

  <!-- Step 7 (Locked) -->
  <circle cx="860" cy="160" r="18" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <text x="855" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">7</text>
  <text x="835" y="200" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">7. PRCC Custodia</text>

  <!-- Step 8 (Locked) -->
  <circle cx="990" cy="160" r="18" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <text x="985" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">8</text>
  <text x="965" y="200" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">8. Validación</text>

  <!-- Step 9 (Locked) -->
  <circle cx="1120" cy="160" r="18" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <text x="1115" y="165" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">9</text>
  <text x="1100" y="200" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">9. Cierre</text>

  <!-- STEP CONTENT BODY (TWO COLUMNS: FORM + RAG NORMATIVA ANCHOR) -->
  <!-- Left Column: Form Controls & Validation -->
  <rect x="30" y="245" width="720" height="475" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  
  <text x="55" y="285" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="18" font-weight="700">Paso 4: Análisis de Error Level Analysis (ELA) en Capturas</text>
  <text x="55" y="308" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="13">Complete las verificaciones obligatorias para desbloquear el Paso 5.</text>

  <!-- Form Field 1 -->
  <text x="55" y="350" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="13" font-weight="600">Herramienta Forense Empleada *</text>
  <rect x="55" y="365" width="670" height="42" rx="6" fill="#0D1117" stroke="#FECF06" stroke-width="1.5"/>
  <text x="75" y="391" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="13">PhotoHolmes Python Engine v2.4 (ELA Matrix Analysis)</text>

  <!-- Form Field 2 -->
  <text x="55" y="430" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="13" font-weight="600">Nivel de Error Mínimo / Escala de Compresión (%) *</text>
  <rect x="55" y="445" width="670" height="42" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="75" y="471" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="13">95% (Residuo de Gradiante Homogéneo - Sin Alteración Artefactos)</text>

  <!-- Switches / Checkboxes Panel -->
  <rect x="55" y="510" width="670" height="120" rx="8" fill="#0D1117" stroke="#21262D"/>
  
  <!-- Switch 1 -->
  <rect x="75" y="530" width="45" height="24" rx="12" fill="#00FF41"/>
  <circle cx="106" cy="542" r="9" fill="#0D1117"/>
  <text x="135" y="547" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="13">Verificación de metadatos EXIF / JFIF sin manipulación temporal</text>

  <!-- Switch 2 -->
  <rect x="75" y="575" width="45" height="24" rx="12" fill="#00FF41"/>
  <circle cx="106" cy="587" r="9" fill="#0D1117"/>
  <text x="135" y="592" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="13">Cálculo de Hash SHA-256 coincidente con la imagen matriz</text>

  <!-- Action Buttons -->
  <rect x="500" y="655" width="225" height="48" rx="8" fill="#FECF06" filter="url(#glow-lime)"/>
  <text x="525" y="684" fill="#0D1117" font-family="Ubuntu, sans-serif" font-weight="800" font-size="14">GUARDAR Y AVANZAR A PASO 5 →</text>

  <!-- Right Column: RAG Anchored Normative Panel -->
  <rect x="770" y="245" width="400" height="475" rx="10" fill="#161B22" stroke="#9DFF00" stroke-width="1.5"/>

  <!-- RAG Header Badge -->
  <rect x="790" y="265" width="360" height="35" rx="6" fill="rgba(157, 255, 0, 0.1)" stroke="#9DFF00" stroke-width="1"/>
  <text x="810" y="287" fill="#9DFF00" font-family="Fira Code, monospace" font-size="12" font-weight="700">⚓ NORMATIVA ANCLADA (RAG COINCIDENCIA)</text>

  <text x="790" y="330" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">MUCC-2017 Cap. III Art. 14</text>
  <text x="790" y="350" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Manual Único de Cadena de Custodia de Evidencias Digitales</text>

  <!-- Extract Text Container -->
  <rect x="790" y="370" width="360" height="230" rx="8" fill="#0D1117" stroke="#21262D"/>
  <text x="805" y="398" fill="#9DFF00" font-family="Ubuntu, sans-serif" font-size="12" font-style="italic">"Toda evidencia fotográfica o digital extraída de servicios de mensajería instantánea deberá ser sometida a pruebas de análisis de nivel de error (ELA) para descartar inserciones, modificaciones o fotomontajes..."</text>
  
  <text x="805" y="475" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Base Legal Adicional:</text>
  <text x="805" y="500" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">• COPP Art. 223 - Peritajes Científicos</text>
  <text x="805" y="525" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">• ISO/IEC 27037:2012 Sec. 6.3 - Análisis</text>
  <text x="805" y="550" fill="#FECF06" font-family="Fira Code, monospace" font-size="11">• Ley Mensajes de Datos Art. 4 - Validez</text>

  <!-- Hash Audit Box -->
  <rect x="790" y="620" width="360" height="80" rx="6" fill="#0D1117" stroke="#00FF41" stroke-width="1"/>
  <text x="805" y="642" fill="#00FF41" font-family="Fira Code, monospace" font-size="11" font-weight="600">SELLO DE AUDITORÍA SHA-256 GENERADO:</text>
  <text x="805" y="665" fill="#FFFFFF" font-family="Fira Code, monospace" font-size="10">8f4a3e21bc90a7761001e45ff32a90... (REGISTRADO)</text>

</svg>
