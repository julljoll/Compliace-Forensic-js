<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-personal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <pattern id="grid-personal" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="1" opacity="0.4"/>
    </pattern>

    <filter id="glow-gold-personal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-grad-personal)"/>
  <rect width="1200" height="750" fill="url(#grid-personal)"/>

  <!-- TOP HEADER -->
  <rect x="30" y="30" width="1140" height="65" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="60" y="70" fill="#FECF06" font-family="Ubuntu, sans-serif" font-weight="700" font-size="20">DIRECTORIO DE PERSONAL, PERITOS &amp; FISCALES AUTORIZADOS</text>
  <text x="620" y="70" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="15">|</text>
  <text x="640" y="70" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-weight="500" font-size="15">Gestión de Credenciales &amp; Firma Digital SHA-256</text>

  <rect x="980" y="48" width="160" height="30" rx="15" fill="rgba(0, 255, 65, 0.15)" stroke="#00FF41" stroke-width="1"/>
  <text x="1000" y="68" fill="#00FF41" font-family="Fira Code, monospace" font-size="12" font-weight="600">8 PERITOS ACTIVOS</text>

  <!-- PERSONNEL CARDS GRID (4 PERITO CREDENTIAL CARDS) -->
  
  <!-- Card 1: Perito Principal Senior -->
  <rect x="30" y="115" width="555" height="280" rx="10" fill="#161B22" stroke="#FECF06" stroke-width="1.5" filter="url(#glow-gold-personal)"/>
  
  <!-- Avatar Circle Visual -->
  <circle cx="95" cy="180" r="40" fill="#0D1117" stroke="#FECF06" stroke-width="2"/>
  <text x="95" y="188" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="26" font-weight="700" text-anchor="middle">JP</text>
  
  <rect x="155" y="145" width="310" height="26" rx="4" fill="rgba(254, 207, 6, 0.15)"/>
  <text x="165" y="163" fill="#FECF06" font-family="Fira Code, monospace" font-size="11" font-weight="700">PERITO FORENSE SENIOR - AUDIOS &amp; EVIDENCIA</text>

  <text x="155" y="195" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="20" font-weight="700">Ing. José Pérez</text>
  <text x="155" y="215" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="13">C.I. V-18.491.029 | CIV N° 284.102 | INPRE N° 98.410</text>

  <!-- Technical Details Inner Box -->
  <rect x="50" y="240" width="515" height="135" rx="6" fill="#0D1117" stroke="#21262D"/>
  <text x="70" y="265" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Firma Digital PGP/SHA256:</text>
  <text x="230" y="265" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">0x9F8A...201B (VERIFICADA)</text>

  <text x="70" y="295" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Biometría Registrada:</text>
  <text x="230" y="295" fill="#9DFF00" font-family="Ubuntu, sans-serif" font-size="12">Pulgares Bilaterales OK (MUCC-2017)</text>

  <text x="70" y="325" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Certificaciones:</text>
  <text x="230" y="325" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="12">IPED Master Forensics, FTK Imager Ace</text>

  <text x="70" y="355" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Casos Dictaminados:</text>
  <text x="230" y="355" fill="#FECF06" font-family="Fira Code, monospace" font-size="12" font-weight="700">84 Casos con Validez Legal</text>

  <!-- Card 2: Fiscal de Guardia / Ministerio Público -->
  <rect x="615" y="115" width="555" height="280" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  
  <circle cx="680" cy="180" r="40" fill="#0D1117" stroke="#00FF41" stroke-width="2"/>
  <text x="680" y="188" fill="#00FF41" font-family="Ubuntu, sans-serif" font-size="26" font-weight="700" text-anchor="middle">MG</text>

  <rect x="740" y="145" width="310" height="26" rx="4" fill="rgba(0, 255, 65, 0.15)"/>
  <text x="750" y="163" fill="#00FF41" font-family="Fira Code, monospace" font-size="11" font-weight="700">FISCAL DE GUARDIA - COMPETENCIA NACIONAL</text>

  <text x="740" y="195" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="20" font-weight="700">Lcda. María Gómez</text>
  <text x="740" y="215" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="13">C.I. V-15.109.821 | Fiscal 83° Nacional</text>

  <rect x="635" y="240" width="515" height="135" rx="6" fill="#0D1117" stroke="#21262D"/>
  <text x="655" y="265" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Despacho Fiscal:</text>
  <text x="815" y="265" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="12">Fiscalía General de la República</text>

  <text x="655" y="295" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Clave Pública RSA-4096:</text>
  <text x="815" y="295" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">0x7F83...D65D (ACTIVA)</text>

  <text x="655" y="325" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Autorización PRCC:</text>
  <text x="815" y="325" fill="#9DFF00" font-family="Ubuntu, sans-serif" font-size="12">Recepción de Cadena de Custodia</text>

  <text x="655" y="355" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="12">Estado del Sistema:</text>
  <text x="815" y="355" fill="#00FF41" font-family="Fira Code, monospace" font-size="12">ONLINE (SESIÓN ACTIVA)</text>

  <!-- LOWER PANEL: BIOMETRIC REGISTRATION & CREDENTIAL INTEGRITY -->
  <rect x="30" y="420" width="1140" height="300" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="55" y="455" fill="#FECF06" font-family="Ubuntu, sans-serif" font-size="16" font-weight="700">MODULO DE REGISTRO BIOMÉTRICO &amp; FIRMA DIGITAL DE PERITOS</text>

  <line x1="55" y1="475" x2="1145" y2="475" stroke="#30363D" stroke-width="1"/>

  <!-- Left Subpanel: Fingerprint scanner mockup -->
  <rect x="55" y="495" width="400" height="205" rx="8" fill="#0D1117" stroke="#9DFF00" stroke-width="1"/>
  <text x="75" y="525" fill="#9DFF00" font-family="Fira Code, monospace" font-size="12" font-weight="700">SCANNER BIOMÉTRICO (PULGARES BILATERALES)</text>

  <!-- Graphic fingerprint preview -->
  <rect x="75" y="545" width="90" height="130" rx="6" fill="#161B22" stroke="#9DFF00" stroke-width="1.5"/>
  <path d="M 120 575 Q 130 560 140 575 Q 145 600 120 640" fill="none" stroke="#9DFF00" stroke-width="2" filter="url(#glow-gold-personal)"/>
  <path d="M 112 585 Q 130 570 135 585 Q 140 605 115 635" fill="none" stroke="#9DFF00" stroke-width="1.5"/>
  <text x="80" y="663" fill="#9DFF00" font-family="Fira Code, monospace" font-size="9">PULGAR IZQ OK</text>

  <rect x="180" y="545" width="90" height="130" rx="6" fill="#161B22" stroke="#9DFF00" stroke-width="1.5"/>
  <path d="M 225 575 Q 235 560 245 575 Q 250 600 225 640" fill="none" stroke="#9DFF00" stroke-width="2" filter="url(#glow-gold-personal)"/>
  <text x="185" y="663" fill="#9DFF00" font-family="Fira Code, monospace" font-size="9">PULGAR DER OK</text>

  <text x="285" y="570" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="12" font-weight="600">Resolución DPI: 1200 DPI</text>
  <text x="285" y="595" fill="#8B949E" font-family="Ubuntu, sans-serif" font-size="11">Plantilla ANSI/NIST-ITL 1-2011</text>
  <text x="285" y="620" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">Status: Huella Coincidente</text>

  <!-- Right Subpanel: Key pair & Certification Details -->
  <rect x="475" y="495" width="670" height="205" rx="8" fill="#0D1117" stroke="#21262D"/>
  <text x="495" y="525" fill="#FFFFFF" font-family="Ubuntu, sans-serif" font-size="14" font-weight="700">REQUISITOS LEGALES DE ACREDITACIÓN PERICIAL (MUCC-2017 &amp; COPP)</text>
  
  <text x="495" y="555" fill="#FECF06" font-family="Fira Code, monospace" font-size="12">✓ Título Universitario en Ingeniería / Informática o Disciplina Forense</text>
  <text x="495" y="580" fill="#FECF06" font-family="Fira Code, monospace" font-size="12">✓ Colegiatura CIV / Inpreabogado Vigente y sin Sanciones</text>
  <text x="495" y="605" fill="#FECF06" font-family="Fira Code, monospace" font-size="12">✓ Juramentación Judicial ante el Tribunal de la Causa (COPP Art. 223)</text>
  <text x="495" y="630" fill="#FECF06" font-family="Fira Code, monospace" font-size="12">✓ Certificado digital de la Llave PGP SHA-256 expedido por CMS SHA256.US</text>

  <rect x="495" y="650" width="630" height="35" rx="4" fill="rgba(0, 255, 65, 0.1)" stroke="#00FF41" stroke-width="1"/>
  <text x="515" y="672" fill="#00FF41" font-family="Fira Code, monospace" font-size="11">PERITOS HABILITADOS PARA FIRMA DE PLANILLAS Y DICTÁMENES PERICIALES</text>

</svg>
